<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" fill="none">
  <!-- Fundo sutil -->
  <rect width="400" height="300" fill="#F0EBE0" rx="0"/>

  <!-- Frasco esquerdo (Erlenmeyer menor) -->
  <path d="M140 70 L140 130 L108 188 L172 188 Z"
    stroke="#7C6248" stroke-width="3" fill="none"
