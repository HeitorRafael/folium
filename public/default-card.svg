    stroke="#7C6248" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
  <!-- Bolhas frasco esquerdo -->
  <circle cx="122" cy="172" r="5" stroke="#7C6248" stroke-width="2" fill="none" opacity="0.4"/>
  <circle cx="133" cy="155" r="4" stroke="#7C6248" stroke-width="2" fill="none" opacity="0.35"/>
  <circle cx="148" cy="135" r="6.5" stroke="#7C6248" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="140" cy="112" r="4" stroke="#7C6248" stroke-width="2" fill="none" opacity="0.25"/>

  <!-- Frasco direito (Erlenmeyer maior) -->
