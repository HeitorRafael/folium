  <circle cx="228" cy="163" r="5" stroke="#7C6248" stroke-width="2" fill="none" opacity="0.4"/>
  <circle cx="245" cy="143" r="8" stroke="#7C6248" stroke-width="2" fill="none" opacity="0.35"/>
  <circle cx="255" cy="120" r="5.5" stroke="#7C6248" stroke-width="2" fill="none" opacity="0.3"/>
  <circle cx="248" cy="97" r="4" stroke="#7C6248" stroke-width="2" fill="none" opacity="0.25"/>
  <circle cx="260" cy="78" r="3" stroke="#7C6248" stroke-width="2" fill="none" opacity="0.2"/>
